# 一键部署：docker compose up -d --build
# 密钥优先从同目录 .env 读取（compose 自动加载），也可写入挂载的 config.yaml。

services:
  new-api-proxy:
    build: .
    image: new-api-proxy:latest
    container_name: new-api-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 配置文件只读挂载（含 model_map/voice_map，及 ${ENV} 占位）
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # 从宿主环境或 .env 注入（见 .env.example）
      ARK_API_KEY: ${ARK_API_KEY:-}
      SPEECH_APP_ID: ${SPEECH_APP_ID:-}
      SPEECH_ACCESS_TOKEN: ${SPEECH_ACCESS_TOKEN:-}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      # 本代理入口鉴权（留空=不校验）
      PROXY_AUTH_KEY: ${PROXY_AUTH_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
